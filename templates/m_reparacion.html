<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/labels.css">
    <title>Document</title>
</head>
<body>
    <nav>
        <a href="/back" class="nav-link">Volver</a>
    </nav>

<div class="form-container">
    <h1>Mandar a reparar</h1>

    <form action="/dashboard/m_reparacion" method="post">

        <div class="form-group">
            <label for="id">ID:</label>
            <input type="text" id="id" name="id" required>
        </div>

        <div class="form-group">
            <label for="reported_by">Reportado por:</label>
            <input type="text" id="reported_by" name="reported_by" required>
        </div>

        <div class="form-group full-width">
            <label for="description">Comentario:</label>
            <textarea id="description" name="description"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit"
                onclick="window.alert('Se agregó correctamente a mantenimiento/reparación')">
                Mandar a reparación
            </button>
        </div>

    </form>
</div>

</body>
</html>
