<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/labels.css">
    <title>Document</title>
</head>
<body>
     <nav>
        <a href="/back" class="nav-link">Volver</a>
    </nav>

<div class="form-container">
    <h1>Agregar equipo</h1>

    <form action="/dashboard/agregar_equipo" method="post">

        <div class="form-group">
            <label for="equipo_type_id">Tipo:</label>
            <select id="equipo_type_id" name="equipo_type_id">
                <option value="1">Laptop</option>
                <option value="2">PC</option>
                <option value="3">Monitor</option>
                <option value="4">Router</option>
                <option value="5">Printer</option>
                <option value="6">Switch</option>
                <option value="7">Access Point</option>
                <option value="8">IP Phone</option>
            </select>
        </div>

        <div class="form-group">
            <label for="brand">Marca:</label>
            <input type="text" id="brand" name="brand" required>
        </div>

        <div class="form-group">
            <label for="model">Modelo:</label>
            <input type="text" id="model" name="model" required>
        </div>

        <div class="form-group">
            <label for="serial_number">Número de serie:</label>
            <input type="text" id="serial_number" name="serial_number" required>
        </div>

        <div class="form-group">
            <label for="purchase_date">Fecha de compra:</label>
            <input type="date" id="purchase_date" name="purchase_date" required>
        </div>

        <div class="form-group">
            <label for="warranty_end">Fin de garantía:</label>
            <input type="date" id="warranty_end" name="warranty_end">
        </div>

        <div class="form-group full-width">
            <label for="description">Descripción:</label>
            <textarea id="description" name="description"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" onclick="window.alert('Se agregó correctamente el equipo')">
                Crear equipo
            </button>
        </div>

    </form>
</div>

    
</body>
</html>
