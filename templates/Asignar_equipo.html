<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/labels.css">
    <title>Document</title>
</head>
<body>
    <nav>
        <a href="/back" class="nav-link">Volver</a>
    </nav>

<div class="form-container">
    <h1>Asignar equipo</h1>

    <form action="/dashboard/asignar" method="post">

        <div class="form-group">
            <label for="equipo_id">Equipo:</label>
            <input type="text" id="equipo_id" name="equipo_id" required>
        </div>

        <div class="form-group">
            <label for="employee_id">Empleado:</label>
            <input type="text" id="employee_id" name="employee_id" required>
        </div>

        <div class="form-group">
            <label for="assigned_by">Asignado por:</label>
            <input type="text" id="assigned_by" name="assigned_by" required>
        </div>

        <div class="form-group">
            <label for="notes">Comentario:</label>
            <input type="text" id="notes" name="notes">
        </div>

        <div class="form-actions">
            <button type="submit">
                Asignar equipo
            </button>
        </div>

    </form>
</div>

    
</body>
</html>
